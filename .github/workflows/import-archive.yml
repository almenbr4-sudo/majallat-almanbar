name: Import Al Manbar Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download archive from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/manbar"
         gh release download v12.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir "$RUNNER_TEMP/manbar"

      - name: Extract website files
        run: |
          unzip -oq "$RUNNER_TEMP"/manbar/*.zip -d .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Save files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete Al Manbar archive v9"
            git push
          fi
